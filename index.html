<script>
"use strict";
/* ============ PROMPT v2.1 ============ */
const SYSTEM_PROMPT = `FOOTBALL AGENT COPILOT — v2.1

Tu es mon copilote professionnel spécialisé dans le métier d'agent de joueurs de football. Tu n'es ni un CRM, ni un moteur de scoring, ni une base de données : tu ne disposes que des informations que je te fournis ici (fiches, sources, notes). Tu n'as pas accès au web.

Mission : m'aider à comprendre une situation, prendre une meilleure décision et déterminer l'action suivante la plus pertinente, en trois étapes : 1) devenir compétent ; 2) obtenir mes premiers mandats ; 3) gérer ensuite joueurs, clubs, réseau, négociations et opportunités.

1. NE JAMAIS FABRIQUER
Chaque information factuelle importante porte un statut :
- CONFIRMED : vérifiée par une source fiable citée (source + date).
- USER-PROVIDED : fournie par moi, non vérifiée par toi.
- ESTIMATE : estimation argumentée.
- INFERENCE : déduite d'éléments connus.
- RUMOUR : rapportée, non confirmée.
- UNKNOWN : absente ou insuffisante.
Ne transforme jamais une estimation, une inférence ou une rumeur en fait. Ne fabrique jamais : salaire, contrat, clause, intérêt d'un club, besoin d'un club, budget, agent actuel, contact, offre, blessure, commission. Si une information manque, dis-le.
Toute information d'actualité que tu connais de mémoire (effectifs, transferts, entraîneurs, contrats, dirigeants) est au mieux ESTIMATE, possiblement périmée : signale-le.

2. PAS DE FAUSSE PRÉCISION
Aucun score chiffré sauf si les variables sont disponibles, définies, pondérées et fiables. Sinon : Très favorable / Favorable / Mitigé / Défavorable / Très défavorable, avec justification. Pour comparer des options : matrice multicritère transparente.

3. STRUCTURE DE RÉPONSE
Avant de répondre, vérifie silencieusement : ce qui est certain, ce qui est supposé, ce qui manque réellement, l'enjeu principal, les options, le risque principal.
Pour toute décision importante, distingue : FACTS / UNKNOWN / INFERENCES / OPTIONS / RECOMMENDATION / WHAT WOULD CHANGE MY MIND.
Réponds avec le niveau de détail nécessaire, pas davantage. Ne réponds jamais seulement « ça dépend » : donne une recommandation principale.
Termine chaque analyse opérationnelle par un titre NEXT BEST ACTION suivi d'une seule action spécifique, réalisable, proportionnée à mon stade (plusieurs uniquement si elles doivent vraiment être menées en parallèle).
Ne pose une question que si sa réponse peut changer la décision ; sinon, prends l'hypothèse la plus raisonnable, nomme-la et avance.

4. HIÉRARCHIE EN CAS DE CONFLIT
1) légalité et conformité ; 2) intérêts du joueur ; 3) exactitude ; 4) qualité de la décision ; 5) carrière à long terme ; 6) relation ; 7) efficacité ; 8) économie. Une commission plus élevée ne rend jamais une opération meilleure pour le joueur.

5. MODE JURIDIQUE
Déclenché par : représentation, rémunération, mineurs, transferts, contrats, conflits d'intérêts, double représentation, données personnelles, fiscalité, règlement FIFA, fédération nationale.
Identifie d'abord JURIDICTION / DATE APPLICABLE / TYPE D'OPÉRATION, puis distingue RULE CONFIRMED / INTERPRETATION / UNRESOLVED / VERIFY.
Distingue les niveaux : FIFA, confédération, fédération nationale, droit national, ligue. Ne suppose jamais qu'une règle d'un pays s'applique ailleurs.
Une règle n'est RULE CONFIRMED que si son texte figure dans les SOURCES fournies : cite le titre, l'article et la date de version. Sans source fournie, marque UNRESOLVED / VERIFY et indique où vérifier. Ne reconstruis jamais un article de mémoire. Certaines dispositions du règlement FIFA sur les agents ont été contestées en justice : signale-le quand c'est pertinent et renvoie à la vérification du texte en vigueur.
Signale quand la validation d'un avocat ou d'un fiscaliste est nécessaire.

6. MINEURS
Si un joueur a moins de 18 ans, ou si son âge est inconnu : vérification de l'âge et mode juridique AVANT toute stratégie d'approche. Priorité : bien-être, éducation, protection, conformité. Aucun contact direct avec un mineur hors du cadre autorisé, aucun contournement des représentants légaux ni des règles applicables.

7. DONNÉES PERSONNELLES
Ne demande et ne conserve que les données utiles à la décision. Pas de données de santé sauf si un joueur représenté les a communiquées et qu'elles conditionnent une décision. Rappelle l'obligation d'information quand je collecte des données sur un tiers.

8. MODE EXAMEN / APPRENTISSAGE
L'examen d'agent FIFA se passe à livre ouvert : l'objectif est de retrouver vite le bon article et de l'appliquer, pas de le réciter.
Pour une notion : explication simple, puis texte (cité depuis les SOURCES, sinon UNRESOLVED / VERIFY), application concrète, cas pratique, pièges classiques, test, correction de mon raisonnement, lien avec une vraie négociation.
Chaque question d'entraînement exige la référence exacte de l'article.

9. FORMATS
ANALYSE D'UN JOUEUR : PLAYER SNAPSHOT / CURRENT SITUATION / SIGNALS / CAREER QUESTION / MARKET HYPOTHESES (types de clubs plausibles, jamais présentés comme intéressés) / REPRESENTATION ANGLE / ACCESS STRATEGY / RISKS / MISSING INFORMATION / NEXT BEST ACTION.
ANALYSE D'UN CLUB : CLUB CONTEXT / SQUAD OBSERVATIONS / POSSIBLE NEEDS (hypothèses, sauf déclaration confirmée du club) / RECRUITMENT PATTERNS / DECISION MAKERS (seulement si confirmés) / NETWORK ACCESS / PLAYER MATCHES / INFORMATION TO VERIFY / NEXT BEST ACTION.
ANALYSE D'UNE OFFRE : KNOWN TERMS / MISSING TERMS / SPORTING ANALYSIS / CAREER ANALYSIS (12–36 mois) / FINANCIAL ANALYSIS / CONTRACTUAL & REGULATORY FLAGS / LEVERAGE / OPTIONS / RECOMMENDATION / NEGOTIATION PLAN (objectif, concessions, lignes rouges, BATNA) / NEXT BEST ACTION. Vérifie aussi que je suis habilité à intervenir (licence, mandat écrit).
PROSPECTION : cherche les situations où un agent crée de la valeur (transition académie vers pro, échéance contractuelle, sous-exposition, progression rapide, changement de statut, palier difficile). Pour chaque prospect : WHY INTERESTING / WHY NOW / WHY ME / ACCESSIBILITY / VALUE I CAN CREATE / RED FLAGS / NEXT ACTION. Ne recommande aucun contact interdit par les règles.
RENDEZ-VOUS : OBJECTIVE / WHAT I KNOW / WHAT I NEED TO LEARN / QUESTIONS TO ASK / VALUE I CAN BRING / LIKELY OBJECTIONS / RESPONSES / INFORMATION NOT TO OVERSTATE / DESIRED OUTCOME / FOLLOW-UP PLAN.
RÉSEAU : pourquoi cette personne est pertinente, quelle valeur je lui apporte, pourquoi elle accepterait de me parler, bon et mauvais premier contact, comment entretenir la relation sans demander. Introductions légitimes plutôt que démarchage de masse.
COMMUNICATION : adapte canal, longueur, langue, formalité, relation, culture, objectif. Un message professionnel est court, spécifique, crédible, utile, facile à traiter. Jamais de faux intérêt, de faux mandat ni de pression.

10. THINKING CHECK (silencieux, affiché seulement s'il apporte quelque chose)
SECOND ORDER, PRE-MORTEM, CONTRARIAN, OPPORTUNITY COST.

11. ACTION AVANT ANALYSE
Si de nouvelles données ne peuvent plus changer la décision, écris ENOUGH INFORMATION TO ACT puis la NEXT BEST ACTION.

12. PROGRESSION
STAGE 0 LEARN, 1 ACCESS, 2 ACQUIRE, 3 REPRESENT, 4 TRANSACT, 5 SCALE. Adapte la sophistication à mon stade réel. Aux stages 0 à 2, priorités : cadre réglementaire, métier réel, réseau, prospects, entraînement aux rendez-vous, premiers mandats, négociation. Ne construis pas d'outils de Stage 5 au Stage 0.

Ton objectif n'est pas de paraître intelligent. C'est de m'aider à devenir un meilleur agent et à agir correctement dans le monde réel.`;

const STAGES = [
  ["LEARN","Maîtriser le cadre réglementaire et réussir l'examen."],
  ["ACCESS","Construire un réseau utile par des introductions légitimes."],
  ["ACQUIRE","Obtenir les premiers mandats."],
  ["REPRESENT","Créer de la valeur pour les joueurs représentés."],
  ["TRANSACT","Gérer contrats, négociations et opérations."],
  ["SCALE","Structurer une agence."]

const STATUS_RE = /\b(CONFIRMED|USER-PROVIDED|ESTIMATE|INFERENCE|RUMOUR|UNKNOWN|RULE CONFIRMED|UNRESOLVED \/ VERIFY|UNRESOLVED|VERIFY|ENOUGH INFORMATION TO ACT)\b/g;
function inlineMd(s){
  return s.replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g,"$1<em>$2</em>")
    .replace(/(^|[^\w])_([^_\n]+)_(?!\w)/g,"$1<em>$2</em>")
    .replace(STATUS_RE,m=>`<span class="st st-${stClass(m)}">${m}</span>`);
}
function md(src){
  const L=esc(src||"").split("\n");const out=[];let i=0;
  const isList=l=>/^\s*([-*•]|\d+[.)])\s+/.test(l), isTbl=l=>/^\s*\|.*\|\s*$/.test(l);
  while(i<L.length){
    const l=L[i];let m;
    if(!l.trim()){i++;continue}
    if(/^\s*```/.test(l)){const b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;out.push("<pre><code>"+b.join("\n")+"</code></pre>");continue}
    if((m=l.match(/^\s*(#{1,6})\s+(.*)/))){const lv=Math.min(m[1].length+2,5);out.push(`<h${lv}>${inlineMd(m[2])}</h${lv}>`);i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(isTbl(l)){let rows=[];while(i<L.length&&isTbl(L[i]))rows.push(L[i++]);rows=rows.filter(r=>!/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>inlineMd(c.trim()));
      out.push('<div class="tbl"><table>'+rows.map((r,k)=>"<tr>"+cells(r).map(c=>k?`<td>${c}</td>`:`<th>${c}</th>`).join("")+"</tr>").join("")+"</table></div>");continue}
    if(isList(l)){const ord=/^\s*\d+[.)]/.test(l);const it=[];while(i<L.length&&(isList(L[i])||(L[i].trim()&&/^\s{2,}\S/.test(L[i])&&it.length))){if(isList(L[i]))it.push(L[i].replace(/^\s*([-*•]|\d+[.)])\s+/,""));else it[it.length-1]+="<br>"+L[i].trim();i++}
      out.push(`<${ord?"ol":"ul"}>`+it.map(x=>"<li>"+inlineMd(x)+"</li>").join("")+`</${ord?"ol":"ul"}>`);continue}
    if(/^&gt;\s?/.test(l)){const b=[];while(i<L.length&&/^&gt;\s?/.test(L[i]))b.push(L[i++].replace(/^&gt;\s?/,""));out.push("<blockquote>"+inlineMd(b.join("<br>"))+"</blockquote>");continue}
    const b=[l];i++;
    while(i<L.length&&L[i].trim()&&!/^\s*(#{1,6}\s|```)/.test(L[i])&&!isTbl(L[i])&&!isList(L[i])&&!/^&gt;/.test(L[i]))b.push(L[i++]);
    const one=b[0].trim().replace(/[:：]\s*$/,"");
    if(one.length>=4&&one.length<60&&one===one.toUpperCase()&&/[A-Z]/.test(one)&&!/[a-z]/.test(one)){out.push('<h5 class="caps">'+inlineMd(one)+"</h5>");b.shift();if(!b.length)continue}
    out.push("<p>"+inlineMd(b.join("<br>"))+"</p>");
  }
  return out.join("");
}
function extractNBA(text){
  const up=text.toUpperCase();const i=up.lastIndexOf("NEXT BEST ACTION");if(i<0)return"";
  const rest=text.slice(i+16).split("\n").map(s=>s.replace(/^[\s*#:—–\-0-9.)]+/,"").replace(/[*`#_]/g,"").trim()).filter(Boolean);
  return (rest[0]||"").slice(0,180);
}

const Store = {
  db:null, base:null, q:{},
  async init(){
    renderAll();
    let db=null,user=null,sample=null,downloads=null;
    if(window.claude&&typeof window.claude.use==="function"){
      try{[db,user,sample,downloads]=await Promise.all(["db","user","sample","downloads"].map(n=>window.claude.use(n).catch(()=>null)))}catch(e){}
    }
    S.sample=sample; S.ai=sample?"on":"off"; S.downloads=downloads;
    let id=null; if(user){try{id=await user.id()}catch(e){}}
    if(db&&id){this.db=db;this.base=db.doc("data/users/"+id+"/profile");S.mode="db";this.subscribe()}
    else this.loadLocal();
    renderAll();
  },
  subscribe(){
    this.base.onSnapshot(s=>{S.profile={...DEFAULT_PROFILE,...(s.exists?cl(s.data()):{})};schedule()},e=>this.fail(e));
    for(const c of COLS){
      this.base.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={...cl(d.data()),id:d.id}});S.data[c]=o;schedule()},e=>this.fail(e));
    }
  },
  fail(e){if(e&&e.code==="revoked"){S.mode="memory";renderChrome()}else if(e){toast("Synchronisation interrompue. Recharge la page.")}},
  loadLocal(){
    try{const raw=localStorage.getItem("agent-copilot.v1");if(raw){const p=JSON.parse(raw);S.profile={...DEFAULT_PROFILE,...(p.profile||{})};for(const c of COLS)S.data[c]=p.data?.[c]||{}}S.mode="local"}
    catch(e){S.mode="memory"}
  },
  saveLocal(){if(S.mode!=="local")return;try{localStorage.setItem("agent-copilot.v1",JSON.stringify({profile:S.profile,data:S.data}))}catch(e){S.mode="memory";renderChrome();toast("Stockage local indisponible : rien n'est enregistré dans cette vue.")}},
  enqueue(key,fn){const p=(this.q[key]||Promise.resolve()).then(fn).catch(writeError);this.q[key]=p;return p},
  put(col,obj){
    obj=cl(obj);obj.id=obj.id||uid();const now=Date.now();obj.updatedAt=now;if(!obj.createdAt)obj.createdAt=now;
    S.data[col][obj.id]=obj;schedule();
    if(S.mode==="db"){const ref=this.base.collection(col).doc(obj.id);return this.enqueue(ref.path,()=>ref.set(obj)).then(()=>obj)}
    this.saveLocal();return Promise.resolve(obj);
  },
  del(col,id){
    delete S.data[col][id];schedule();
    if(S.mode==="db"){const ref=this.base.collection(col).doc(id);return this.enqueue(ref.path,()=>ref.delete())}
    this.saveLocal();return Promise.resolve();
  },
  setProfile(p){
    S.profile={...S.profile,...cl(p)};schedule();
    if(S.mode==="db"){const body=cl(S.profile);return this.enqueue(this.base.path,()=>this.base.set(body))}
    this.saveLocal();return Promise.resolve();
  }
};

function contextBlock(){

function sourcesBlock(budget=150000){
  const src=vals("sources").filter(s=>s.include!==false&&s.text);
  if(!src.length)return"\n\nSOURCES : aucune source fournie. Toute règle citée doit donc être marquée UNRESOLVED / VERIFY.";
  const per=Math.floor(budget/src.length);
  return "\n\nSOURCES FOURNIES (seuls textes citables comme RULE CONFIRMED) :\n"+src.map(s=>{
    const t=s.text.length>per?s.text.slice(0,per)+"\n[…extrait tronqué pour tenir dans le contexte]":s.text;
    return `=== ${s.title} — ${s.issuer||"émetteur non précisé"} — version du ${s.versionDate||"date inconnue"} ===\n${t}`;}).join("\n\n");
}
function slimRecord(col,r){
  if(!r)return null;const o=cl(r);delete o.updatedAt;delete o.createdAt;delete o.example;
  if(col==="contacts"&&o.journal)o.journal=o.journal.slice(-8);
  return o;

}

function quizStats(){
  const r=vals("quiz").sort((a,b)=>b.ts-a.ts);const last=r.slice(0,20);
  if(!last.length)return{total:0};
  const ok=last.filter(x=>x.correct).length;const sec=Math.round(last.reduce((a,x)=>a+(x.seconds||0),0)/last.length);
  return{total:r.length,last:last.length,pct:Math.round(ok*100/last.length),avgSec:sec};
}

function vCopilot(){
  const threads=vals("threads").sort((a,b)=>b.updatedAt-a.updatedAt);
  const th=S.ui.threadId?S.data.threads[S.ui.threadId]:null;
  const mode=th?th.mode:S.ui.mode;const attach=th?(th.attach||""):S.ui.attach;
  const opts=[...vals("prospects").map(p=>[`prospects:${p.id}`,"Prospect — "+p.name]),...vals("contacts").map(c=>[`contacts:${c.id}`,"Contact — "+c.name])];
  const nSrc=vals("sources").filter(s=>s.include!==false&&s.text).length;
  const msgs=th?th.messages:[];
  return `<section class="copilot">
    <aside class="threads" aria-label="Fils">
      <button class="btn primary" data-act="new-thread">Nouveau fil</button>
      ${threads.map(t=>`<button class="thread" aria-current="${t.id===S.ui.threadId}" data-act="open-thread" data-id="${t.id}"><span class="tm">${esc(MODES[t.mode]?.label||"Libre")} · ${fmtDate(localISO(new Date(t.updatedAt)))}</span><span class="tt">${esc(t.title)}</span></button>`).join("")}
    </aside>
    <div class="panel" style="padding:14px">
      <div class="modes" role="group" aria-label="Mode">${Object.entries(MODES).map(([k,m])=>`<button class="chip" aria-pressed="${k===mode}" data-act="mode" data-mode="${k}">${m.label}</button>`).join("")}</div>
      <div class="row small">
        <label class="f" style="flex:1 1 240px"><span>Fiche jointe</span><select id="cp-attach" data-change="attach"><option value="">Aucune</option>${opts.map(([v,l])=>`<option value="${v}"${sel(v,attach)}>${esc(l)}</option>`).join("")}</select></label>
        <label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" id="cp-deep" data-bind="deep" ${S.ui.deep?"checked":""}> Analyse approfondie</label>
        ${MODES[mode].sources?`<span class="pill ${nSrc?"ok":"late"}" style="align-self:end;margin-bottom:9px">${nSrc} source${nSrc>1?"s":""} incluse${nSrc>1?"s":""}</span>`:""}
      </div>
      ${aiNote()}
      <div class="msgs" id="msgs">
        ${!msgs.length&&!S.ui.busy?`<div class="starters"><span class="eyebrow">Pour démarrer · ${esc(MODES[mode].label)}</span>${(STARTERS[mode]||[]).map((s,i)=>`<button class="starter" data-act="starter" data-i="${i}">${esc(s)}</button>`).join("")}</div>`:""}
        ${msgs.map((m,i)=>m.role==="user"?`<div class="msg-u">${esc(m.content)}</div>`:`<div class="msg-a"><div class="md">${md(m.content)}</div><div class="acts"><button class="btn ghost sm" data-act="copy-msg" data-i="${i}">Copier</button><button class="btn ghost sm" data-act="nba-task" data-i="${i}">Action → tâche</button></div></div>`).join("")}
        ${S.ui.busy?`<div class="msg-a"><div class="md" id="stream">${S.ui.streamText?md(S.ui.streamText):'<p class="thinking">Réflexion…</p>'}</div></div>`:""}
      </div>
      <div class="composer">
        <textarea id="cp-in" data-bind="draft.copilot" rows="3" placeholder="Décris la situation, colle un message, pose ta question…">${esc(S.ui.draft.copilot)}</textarea>
        <div class="row"><button class="btn primary" data-act="send" ${S.ui.busy||S.ai!=="on"?"disabled":""}>Envoyer</button>${S.ui.busy?`<button class="btn" data-act="stop">Arrêter</button>`:""}<span class="spacer"></span><span class="eyebrow">Ctrl / ⌘ + Entrée</span>
        ${th?(S.ui.confirm===`thread:${th.id}`?`<button class="btn danger solid sm" data-act="del" data-col="threads" data-id="${th.id}">Confirmer la suppression</button>`:`<button class="btn ghost sm" data-act="askdel" data-key="thread:${th.id}">Supprimer le fil</button>`):""}</div>
      </div>
    </div>
  </section>`;
}

function vCapture(){
  const c=S.ui.capture,r=c.result;
  const ck=(path,on)=>`<input type="checkbox" data-bind="${path}" ${on!==false?"checked":""}>`;
  let review="";
  if(r){
    const sec=(title,arr,fn)=>arr&&arr.length?`<div><div class="eyebrow" style="margin-bottom:4px">${title}</div><div class="list">${arr.map(fn).join("")}</div></div>`:"";
    review=`<section class="panel"><div class="panel-h"><h2>À enregistrer</h2><span class="eyebrow">décoche ce qui est faux</span></div>
      ${r.summary?`<p style="margin:0">${esc(r.summary)}</p>`:""}
      ${r.sensitive_flag?`<p class="small" style="margin:0"><span class="card-y" style="margin-right:6px;vertical-align:-2px"></span>La note contient une information sensible (santé ou autre). Elle n'a pas été extraite.</p>`:""}
      ${sec("Contacts",r.contacts,(x,i)=>`<label class="item check">${ck(`capture.result.contacts.${i}._on`,x._on)}<div><div class="t">${esc(x.name)}</div><div class="m">${esc([x.role,x.org].filter(Boolean).join(" · "))} ${x.match_id&&S.data.contacts[x.match_id]?"· mise à jour d'une fiche existante":"· nouvelle fiche"}</div></div><span></span></label>`)}
      ${sec("Prospects",r.prospects,(x,i)=>`<label class="item check">${ck(`capture.result.prospects.${i}._on`,x._on)}<div><div class="t">${esc(x.name)}</div><div class="m">${esc([x.position,x.club].filter(Boolean).join(" · "))} · âge : ${esc(x.age_info||"inconnu")}</div></div>${x.age_info!=="majeur"?`<span class="${x.age_info==="mineur"?"card-r":"card-y"}"></span>`:"<span></span>"}</label>`)}
      ${sec("Échanges au journal",r.interactions,(x,i)=>`<label class="item check">${ck(`capture.result.interactions.${i}._on`,x._on)}<div><div class="t">${esc(x.contact_name)}</div><div class="m">${esc(x.summary)}</div></div><span class="pill">${fmtDate(x.date)}</span></label>`)}
      ${sec("Faits",r.facts,(x,i)=>`<label class="item check">${ck(`capture.result.facts.${i}._on`,x._on)}<div><div class="t">${esc(x.text)}</div><div class="m">${esc(x.about)}</div></div>${stChip(x.status||"USER-PROVIDED")}</label>`)}
      ${sec("Tâches",r.tasks,(x,i)=>`<label class="item check">${ck(`capture.result.tasks.${i}._on`,x._on)}<div class="t">${esc(x.title)}</div>${x.due?dueLabel(x.due):"<span></span>"}</label>`)}
      ${r.open_questions&&r.open_questions.length?`<div><div class="eyebrow">Questions ouvertes</div><ul style="margin:4px 0 0;padding-left:20px">${r.open_questions.map(q=>`<li>${esc(q)}</li>`).join("")}</ul></div>`:""}
      <div class="row"><button class="btn primary" data-act="capture-apply">Enregistrer la sélection</button><button class="btn ghost" data-act="capture-clear">Annuler</button></div></section>`;
  }
  return `<section class="panel">
    <div class="panel-h"><h2>Capture</h2><span class="eyebrow">note brute → fiches</span></div>
    <p class="muted small" style="margin:0">Après un appel ou un rendez-vous, écris ou dicte (micro du clavier) ce qui s'est passé. Le copilote propose contacts, échanges, faits avec leur statut et tâches datées. Rien n'est enregistré sans ta validation.</p>
    ${aiNote()}
    <textarea id="cap-in" data-bind="draft.capture" rows="6" placeholder="Ex. : Appel avec le responsable recrutement de [club] : il dit chercher un 6 gaucher U21 pour janvier, budget non communiqué. Rappeler mardi. Il connaît bien l'entraîneur des U19 de [autre club].">${esc(S.ui.draft.capture)}</textarea>
    <div class="row"><button class="btn primary" data-act="capture-run" ${c.busy||S.ai!=="on"?"disabled":""}>${c.busy?"Structuration…":"Structurer"}</button><span class="eyebrow">Ctrl / ⌘ + Entrée</span></div>
  </section>${review}`;
}

function vProspects(){
  const e=S.ui.edit&&S.ui.edit.col==="prospects"?S.ui.edit:null;
  const all=vals("prospects"),f=S.ui.pFilter;
  const cnt=Object.fromEntries(PSTAGES.map(([k])=>[k,all.filter(p=>p.stage===k).length]));
  const list=all.filter(p=>f?p.stage===f:p.stage!=="DROPPED");
  const groups=PSTAGES.filter(([k])=>list.some(p=>p.stage===k));
  return `${e?prospectEditor(e.obj,e.isNew):""}

function fitThread(th){
  th.messages=th.messages.slice(-40).map(m=>({...m,content:String(m.content).slice(0,30000)}));
  while(JSON.stringify(th).length>180000&&th.messages.length>2)th.messages.shift();
  return th;
}
async function send(){
  const text=(S.ui.draft.copilot||"").trim();if(!text||S.ui.busy)return;
  if(!S.sample||S.ai!=="on"){toast("Claude n'est pas disponible dans cette vue.");return}
  let th=S.ui.threadId&&S.data.threads[S.ui.threadId]?cl(S.data.threads[S.ui.threadId]):{id:uid(),mode:S.ui.mode,attach:S.ui.attach||"",title:text.slice(0,80),messages:[]};
  S.ui.threadId=th.id;
  th.messages.push({role:"user",content:text,ts:Date.now()});
  S.ui.draft.copilot="";S.ui.busy=true;S.ui.streamText="";
  Store.put("threads",fitThread(cl(th)));renderAll();
  const el=$("#stream");if(el)el.scrollIntoView({block:"nearest"});
  const input=[{role:"user",content:buildRules(th.mode,th.attach)},...th.messages.slice(-24).map(m=>({role:m.role,content:m.content}))];
  ctl=new AbortController();
  try{
    const r=await S.sample(input,{cache:false,signal:ctl.signal,modelTier:S.ui.deep?"complex":"default",onText:({text})=>{S.ui.streamText=text;const s=$("#stream");if(s)s.innerHTML=md(text)}});
    th.messages.push({role:"assistant",content:r.text+(r.truncated?"\n\n_Réponse tronquée : demande une suite ou découpe la question._":""),ts:Date.now()});
  }catch(e){
    if(e&&e.text)th.messages.push({role:"assistant",content:e.text+"\n\n_Réponse interrompue._",ts:Date.now()});
    const m=aiError(e);if(m)toast(m);
  }finally{
    S.ui.busy=false;S.ui.streamText="";ctl=null;
    Store.put("threads",fitThread(th));renderAll();
  }
}

      interactions:arr("interactions").filter(x=>x.contact_name&&x.summary),facts:arr("facts").filter(x=>x.text),tasks:arr("tasks").filter(x=>x.title),
      open_questions:Array.isArray(r?.open_questions)?r.open_questions.filter(q=>typeof q==="string"&&q.trim()):[],sensitive_flag:!!r?.sensitive_flag}};

async function applyCapture(){
  const r=S.ui.capture.result;if(!r)return;const t=localISO();
  const iso=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||"")?d:null;
  const byName={};const norm=s=>String(s||"").trim().toLowerCase();
  for(const c of vals("contacts"))byName[norm(c.name)]=cl(c);
  const touched={};
  for(const x of r.contacts.filter(x=>x._on)){
    let c=x.match_id&&S.data.contacts[x.match_id]?cl(S.data.contacts[x.match_id]):byName[norm(x.name)]||null;
    if(!c)c={id:uid(),name:x.name,role:ROLES.includes(x.role)?x.role:(x.role?"Autre":""),org:x.org||"",journal:[]};
    else{if(!c.role&&x.role)c.role=ROLES.includes(x.role)?x.role:"Autre";if(!c.org&&x.org)c.org=x.org}
    byName[norm(c.name)]=c;byName[norm(x.name)]=c;touched[c.id]=c;
  }
  for(const x of r.interactions.filter(x=>x._on)){
    let c=byName[norm(x.contact_name)];
    if(!c){c={id:uid(),name:x.contact_name,role:"",org:"",journal:[]};byName[norm(x.contact_name)]=c}
    const d=iso(x.date)||t;c.journal=[...(c.journal||[]),{date:d,summary:x.summary}];
    if(!c.lastInteraction||d>c.lastInteraction)c.lastInteraction=d;touched[c.id]=c;
  }
  const pBy={};for(const p of vals("prospects"))pBy[norm(p.name)]=cl(p);
  const pTouched={};
  for(const x of r.prospects.filter(x=>x._on)){
    let p=x.match_id&&S.data.prospects[x.match_id]?cl(S.data.prospects[x.match_id]):pBy[norm(x.name)]||null;
    const age=["mineur","majeur","inconnu"].includes(x.age_info)?x.age_info:"inconnu";
    if(!p)p={id:uid(),name:x.name,position:x.position||"",club:x.club||"",ageStatus:age,ageSource:age!=="inconnu"?"Note (USER-PROVIDED)":"",stage:"DISCOVERED",contractStatus:"UNKNOWN",facts:[]};
    else{if(!p.position&&x.position)p.position=x.position;if(!p.club&&x.club)p.club=x.club;if(p.ageStatus==="inconnu"&&age!=="inconnu")p.ageStatus=age}
    pBy[norm(x.name)]=p;pTouched[p.id]=p;
  }
  for(const f of r.facts.filter(x=>x._on)){
    const st=FACT_ST.includes(f.status)?f.status:"USER-PROVIDED";
    const p=pBy[norm(f.about)];
    if(p){p.facts=[...(p.facts||[]),{text:f.text,status:st,source:"Capture du "+fmtDate(t)}];pTouched[p.id]=p;continue}
    const c=byName[norm(f.about)];
    if(c){c.notes=((c.notes?c.notes+"\n":"")+`[${st}] ${f.text}`);touched[c.id]=c}
  }
  const ops=[...Object.values(touched).map(c=>Store.put("contacts",c)),...Object.values(pTouched).map(p=>Store.put("prospects",p)),
    ...r.tasks.filter(x=>x._on).map(x=>Store.put("tasks",{title:x.title,due:iso(x.due)||"",done:false}))];
  await Promise.all(ops);
  const n=Object.keys(touched).length+Object.keys(pTouched).length+r.tasks.filter(x=>x._on).length;
  S.ui.capture={busy:false,result:null};S.ui.draft.capture="";
  toast(`${n} fiche${n>1?"s":""} enregistrée${n>1?"s":""}.`);renderAll();
}
async function newQuestion(){
  const src=S.data.sources[S.ui.quizSrc];if(!src||!src.text||!S.sample)return;
  S.ui.quiz={loading:true};renderMain();
  const txt=src.text,W=14000;const start=txt.length>W?Math.floor(Math.random()*(txt.length-W)):0;const ex=txt.slice(start,start+W);
  const recent=vals("quiz").sort((a,b)=>b.ts-a.ts).slice(0,6).map(h=>h.reference).filter(Boolean);
  const prompt=`Tu prépares un candidat à l'examen d'agent de football FIFA (QCM, livre ouvert). Utilise UNIQUEMENT l'extrait ci-dessous. N'invente aucun article : la référence doit figurer dans l'extrait.
Source : ${src.title} — ${src.issuer||"émetteur non précisé"} — version ${src.versionDate||"non datée"}.
${S.ui.quizTheme?`Thème souhaité si l'extrait le couvre : ${S.ui.quizTheme}.`:""}
${recent.length?`Évite ces références déjà posées : ${recent.join(" ; ")}.`:""}
Crée UNE question de mise en situation (cas concret vécu par un agent), quatre options plausibles, une seule correcte. Les mauvaises options doivent correspondre à des erreurs fréquentes.
Réponds avec UNIQUEMENT un objet JSON : {"question":"","options":["","","",""],"answer":0,"reference":"article et alinéa tels qu'écrits dans l'extrait","quote":"phrase copiée mot pour mot depuis l'extrait, 35 mots maximum","explanation":"2 ou 3 phrases","trap":"le piège classique en une phrase"}

EXTRAIT :
"""
${ex}
"""`;
  try{
    const q=await S.sample.json(prompt,{cache:false});
    if(!q||typeof q.question!=="string"||!Array.isArray(q.options)||q.options.length!==4||![0,1,2,3].includes(Number(q.answer)))throw{code:"invalid_json"};
    q.answer=Number(q.answer);q.options=q.options.map(String);
    const n=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[«»“”"]/g,"").replace(/\s+/g," ").trim();
    const verified=!!q.quote&&n(q.quote).length>12&&n(txt).includes(n(q.quote));
    S.ui.quiz={q,verified,startedAt:Date.now(),picked:null,srcId:src.id,srcTitle:src.title};
  }catch(e){S.ui.quiz=null;const m=aiError(e);if(m)toast(m)}
  renderMain();
}
function pickAnswer(i){
  const Q=S.ui.quiz;if(!Q||!Q.q||Q.picked!=null)return;
  Q.picked=i;Q.seconds=Math.floor((Date.now()-Q.startedAt)/1000);clearInterval(timerInt);
  Store.put("quiz",{ts:Date.now(),sourceId:Q.srcId,question:Q.q.question.slice(0,400),reference:String(Q.q.reference||"").slice(0,120),correct:i===Q.q.answer,seconds:Q.seconds,verified:Q.verified});
  renderMain();
}
async function runEval(id){
  const c=EVALS.find(x=>x.id===id);if(!c||!S.sample)return;
  S.ui.evalRun[id]={busy:true,text:""};S.ui.evalChecks[id]={};renderMain();
  ctl=new AbortController();
  try{
    const r=await S.sample([{role:"user",content:buildRules("libre","")},{role:"user",content:c.prompt}],{cache:false,signal:ctl.signal,onText:({text})=>{S.ui.evalRun[id].text=text;const o=$("#ev-"+id);if(o)o.innerHTML=md(text)}});

  }catch(e){S.ui.evalRun[id]={busy:false,text:e&&e.text||""};const m=aiError(e);if(m)toast(m)}
  ctl=null;renderMain();
}
